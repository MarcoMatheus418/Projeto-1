<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <h1>Minhas Tarefas</h1>
        
        <div class="form">
            <input type="text" id="InputTarefa" placeholder="Digite o nome da tarefa">
            <input type="text" id="ImputDescricao" placeholder="Digite a descrição da tarefa">
            <input type="text" id="imputData" placeholder="Digite a Data da Tarefa">
            <select id="ImputPrioridade">
                <option value="baixa">Prioridade Baixa</option>
                <option value="media">Prioridade Media</option>
                <option value="alta">Prioridade Alta</option>
            </select>

            <button id="btnAdicionar">Adicionar</button>
        </div>

        <div class="filtros">
            <button id="btnTodas">Todas</button>
            <button id="btnPendentes">Pendentes</button>
            <button id="btnConcluidas">Concluidas</button>
        </div>

        <ul id="listaTarefas">
         
        </ul>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
